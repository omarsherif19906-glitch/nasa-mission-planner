<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Mission Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>NASA Mission Planner</h1>

    <p>Explore and organize information about NASA space missions.</p>

    <section class="mission-section">
        <h2>Mission Overview</h2>

        <div class="mission-card">
            <h3>Artemis II</h3>
            <p>Destination: Moon</p>
            <p>Status: Planned</p>
        </div>

        <div class="mission-card">
            <h3>International Space Station Mission</h3>
            <p>Destination: Low Earth Orbit</p>
            <p>Status: Active</p>
        </div>
    </section>

</body>
</html>
